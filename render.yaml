services:
  - type: web
    name: quick-filler-cartao-de-ponto
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
      - key: MAX_UPLOAD_MB
        value: "15"
      - key: MAX_OCR_PAGES
        value: "40"
