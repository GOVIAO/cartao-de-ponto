<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quick Filler — Cartão de Ponto e Holerite</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<main class="shell">
  <header><div><span class="eyebrow">QUICK FILLER</span><h1>Transcrição de documentos</h1><p>Envie PDF ou TXT, revise os dados e baixe PDF, TXT ou planilha.</p></div></header>
  <section class="card"><form id="form">
    <label>Tipo de documento<select name="tipo"><option value="cartao-ponto">Cartão de ponto</option><option value="holerite">Holerite</option></select></label>
    <label>Arquivo<input name="arquivo" type="file" accept="application/pdf,.txt,text/plain" required></label>
    <button type="submit">Processar arquivo</button>
  </form><div id="status" class="status" aria-live="polite"></div></section>
  <section id="workspace" class="workspace hidden">
    <div class="pdf-panel card"><h2>Documento</h2><div class="pdf-actions"><a id="pdf-open" class="open-document" target="_blank" rel="noopener">Abrir arquivo selecionado</a></div><iframe id="pdf" title="Documento PDF"></iframe><pre id="txt-preview" class="txt-preview hidden"></pre></div>
    <div class="review-panel card"><div class="review-head"><div><h2>Revisão</h2><p id="warning-summary"></p></div><button id="save" type="button">Salvar correções</button></div>
      <div id="table-wrap" class="table-wrap"></div><div id="bases-wrap"></div>
      <div id="downloads" class="downloads hidden"><a id="pdf-download" target="_blank">Baixar PDF</a><a id="txt" target="_blank">Baixar TXT</a><a id="xlsx" target="_blank">Baixar XLSX</a><a id="csv" target="_blank">Baixar CSV</a><a id="json" target="_blank">Baixar JSON</a></div>
    </div>
  </section>
</main><script src="/static/app.js"></script>
</body></html>
